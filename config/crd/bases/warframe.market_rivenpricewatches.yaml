      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RivenPriceWatch is the Schema for the rivenpricewatches API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RivenPriceWatchSpec defines the desired state of RivenPriceWatch.
            properties:
              buyoutOnly:
                description: BuyoutOnly restricts results to direct-sell auctions,
                  excluding bidding-only listings.
                type: boolean
              maxReRolls:
                description: MaxReRolls limits results to rivens with at most this
                  many re-rolls. 0 means no limit.
                minimum: 0
                type: integer
              minRollQuality:
                description: |-
                  MinRollQuality is the minimum average roll quality (0–100%) required across
                  positive stats for a notification to be sent.
                maximum: 100
                minimum: 0
                type: integer
              negativeStats:
                description: |-
                  NegativeStats controls the negative stat filter:
                  "" = any, "has" = must have one, "none" = no negative, or a specific stat url_name.
                type: string
              notificationWindow:
                description: NotificationWindow restricts notifications to a specific
                  time range each day.
                properties:
                  from:
                    description: From is the start of the window in "HH:MM" format
                      (e.g. "10:00").
                    pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    type: string
                  to:
                    description: To is the end of the window in "HH:MM" format (e.g.
                      "18:00").
                    pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    type: string
                required:
                - from
                - to
                type: object
              playerStatus:
                description: |-
                  PlayerStatus filters auctions by seller online status.
                  Valid values: ingame, online, offline. Defaults to [ingame, online] if not set.
                items:
                  enum:
                  - ingame
                  - online
                  - offline
                  type: string
                type: array
              positiveStats:
                description: |-
                  PositiveStats lists the required positive stat url_names
                  (e.g. ["critical_chance", "critical_damage"]).
                items:
                  type: string
                type: array
              threshold:
                description: Threshold is the platinum price at or below which a notification
                  is sent.
                minimum: 1
                type: integer
              weaponSlug:
                description: WeaponSlug is the URL-friendly weapon identifier (e.g.
                  "falcor", "gram_prime").
                minLength: 1
                type: string
            required:
            - threshold
            - weaponSlug
            type: object
          status:
            description: RivenPriceWatchStatus defines the observed state of RivenPriceWatch.
            properties:
              bestRollQuality:
                description: BestRollQuality is the average roll quality of the cheapest
                  matching auction.
                type: integer
              cheapestPrice:
                description: CheapestPrice is the lowest platinum price found among
                  matching auctions.
