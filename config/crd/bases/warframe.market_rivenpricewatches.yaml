  names:
    kind: RivenPriceWatch
    listKind: RivenPriceWatchList
    plural: rivenpricewatches
    singular: rivenpricewatch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.weaponSlug
      name: Weapon
      type: string
    - jsonPath: .spec.threshold
      name: Threshold
      type: integer
    - jsonPath: .status.cheapestPrice
      name: Cheapest
      type: integer
    - jsonPath: .status.bestRollQuality
