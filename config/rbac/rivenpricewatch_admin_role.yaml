# This rule is not used by the project warframe-market-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over warframe.market.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: warframe-market-operator
    app.kubernetes.io/managed-by: kustomize
  name: rivenpricewatch-admin-role
rules:
- apiGroups:
  - warframe.market
  resources:
  - rivenpricewatches
  verbs:
  - '*'
- apiGroups:
  - warframe.market
  resources:
  - rivenpricewatches/status
  verbs:
  - get
