# This rule is not used by the project warframe-market-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the warframe.market.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: warframe-market-operator
    app.kubernetes.io/managed-by: kustomize
  name: rivenpricewatch-editor-role
rules:
- apiGroups:
  - warframe.market
  resources:
  - rivenpricewatches
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - warframe.market
  resources:
  - rivenpricewatches/status
  verbs:
  - get
