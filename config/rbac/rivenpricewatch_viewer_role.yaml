# This rule is not used by the project warframe-market-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to warframe.market resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: warframe-market-operator
    app.kubernetes.io/managed-by: kustomize
  name: rivenpricewatch-viewer-role
rules:
- apiGroups:
  - warframe.market
  resources:
  - rivenpricewatches
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - warframe.market
  resources:
  - rivenpricewatches/status
  verbs:
  - get
